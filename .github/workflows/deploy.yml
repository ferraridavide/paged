# Builds the editor and publishes it to GitHub Pages (https://paged.davide.im).
#
# One-time setup in the repository on GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Pages → Custom domain: paged.davide.im (tick "Enforce HTTPS")
#   Settings → Secrets and variables → Actions → Variables: the VITE_GOOGLE_* values
#     (see .env.example; they end up in the public bundle, so they are variables, not secrets)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued one but never an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
          VITE_GOOGLE_DRIVE_INSTALL: ${{ vars.VITE_GOOGLE_DRIVE_INSTALL || 'false' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
